name: Build and deploy

on:
    push:
        branches: [master]

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
          contents: write

        steps:
            - uses: actions/checkout@v3

            - name: Prepare environment
              uses: actions/setup-node@v3
              with:
                  node-version: "16"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  # Pin pnpm to v9 to restore auto-approval of build scripts
                  version: 9

            - name: Install deps
              # 'pnpm m i' is a typo; it should be 'pnpm install'
              run: pnpm install

            - name: Build plugin(s)
              run: node ./build.mjs

            - name: Copy additional files
              run: |
                  cp README.md dist/README.md
                  printf -- "---\npermalink: /404.html\n---\n" > dist/404.md
                  printf -- "> **Note:** You accessed a link that returned a 404. How did you end up here!?!\n\n" >> dist/404.md
                  cat README.md >> dist/404.md

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  enable_jekyll: true
                  # cname: example.com
